<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>games · skullsploit</title>
<link rel="icon" type="image/png" href="/img/skull.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<script src="/js/common.js"></script>
<script>mountNav('/games');</script>
<section class="hero" style="padding-top: clamp(60px,8vw,100px); padding-bottom: clamp(40px,5vw,60px);">
  <div class="hero-grid">
    <div>
      <span class="label reveal reveal-1">games</span>
      <h1 class="reveal reveal-2" style="margin-top: 14px; font-size: clamp(56px,12vw,160px);">games</h1>
      <p class="reveal reveal-3 lead" style="max-width: 460px; margin-top: 24px;">games running our backdoor right now. click to jump in.</p>
    </div>
    <aside class="hero-meta reveal reveal-4">
      <div><span class="k">live / total</span><span class="v" id="ttl">—</span></div>
      <div><span class="k">players</span><span class="v" id="sup">—</span></div>
    </aside>
  </div>
</section>
<section class="container-wide" style="padding-top: 0;">
  <div class="stack" style="gap: 16px; margin-bottom: 28px;">
    <div class="row-between" style="gap: 14px;">
      <input id="search" placeholder="search games..." style="max-width: 360px;" />
      <button class="btn-ghost" id="refreshBtn">refresh</button>
    </div>
    <div class="row" style="gap: 6px; flex-wrap: wrap; align-items: center;">
      <span class="label" style="margin-right: 6px;">status</span>
      <button class="btn-ghost active" data-status="all">all</button>
      <button class="btn-ghost" data-status="live">live only</button>
      <button class="btn-ghost" data-status="offline">offline</button>
      <span class="label" style="margin: 0 6px 0 14px;">size</span>
      <button class="btn-ghost active" data-bucket="all">all</button>
      <button class="btn-ghost" data-bucket="0-25">0–25</button>
      <button class="btn-ghost" data-bucket="25-100">25–100</button>
      <button class="btn-ghost" data-bucket="100-1k">100–1k</button>
      <button class="btn-ghost" data-bucket="1k+">1k+</button>
    </div>
  </div>
  <div id="grid" style="display: grid; gap: 18px;"></div>
</section>
<script>mountFooter();</script>
<script>
  let allGames = [];
  let activeBucket = 'all';
  let activeStatus = 'all';

  async function load() {
    try {
      const { games } = await api('/api/games');
      allGames = games;
      const liveGames = games.filter(g => g.live);
      const totalPlayers = games.reduce((s, g) => s + (g.totalPlayers || 0), 0);
      document.getElementById('ttl').textContent = `${liveGames.length} / ${games.length}`;
      document.getElementById('sup').textContent = totalPlayers.toLocaleString();
      render();
    } catch { toast('failed to load games'); }
  }

  (async () => {
    const me = await requireSession();
    if (!me) return;
    await load();
    setInterval(load, 15000);
  })();

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const games = allGames.filter(g => {
      if (q && !g.name.toLowerCase().includes(q)) return false;
      if (activeStatus === 'live' && !g.live) return false;
      if (activeStatus === 'offline' && g.live) return false;
      if (activeBucket !== 'all' && g.bucket !== activeBucket) return false;
      return true;
    });
    const grid = document.getElementById('grid');
    if (!games.length) {
      grid.innerHTML = `<div class="panel"><p class="muted">no games match — try a different filter or wait for more servers.</p></div>`;
      return;
    }
    grid.innerHTML = games.map(g => {
      const sub = g.live
        ? `${g.totalPlayers.toLocaleString()} player${g.totalPlayers === 1 ? '' : 's'} · ${g.serverCount} server${g.serverCount === 1 ? '' : 's'} · ${g.bucket}`
        : `no servers live · last seen ${formatLastSeen(g.lastSeen)}${g.firstSeen ? ' · first seen ' + formatDate(g.firstSeen) : ''}`;
      const chip = g.live
        ? `<span class="chip live">live</span>`
        : `<span class="chip dead">offline</span>`;
      return `
      <a href="/game/${encodeURIComponent(g.placeId)}" class="game-row${g.live ? '' : ' game-row-offline'}" style="text-decoration: none;">
        <div class="panel game-row-panel" style="padding: 0; overflow: hidden;">
          <div class="row-between" style="padding: 18px 22px; gap: 16px; align-items: center;">
            <div class="row" style="gap: 16px; align-items: center; min-width: 0;">
              <div class="game-thumb">
                ${g.thumbnail ? `<img src="${escapeHtml(g.thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" />` : ''}
              </div>
              <div style="min-width: 0;">
                <div class="game-card-name">${escapeHtml(g.name)}</div>
                <div class="muted" style="font-size: 12px; margin-top: 4px;">${sub}</div>
              </div>
            </div>
            <div class="row" style="gap: 12px; align-items: center;">
              ${chip}
              <span class="muted" style="font-size: 12px;">view →</span>
            </div>
          </div>
        </div>
      </a>`;
    }).join('');
  }

  function formatLastSeen(iso) {
    if (!iso) return 'never';
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('refreshBtn').addEventListener('click', () => { load(); toast('refreshed'); });
  document.querySelectorAll('[data-bucket]').forEach(b => {
    b.addEventListener('click', () => {
      activeBucket = b.dataset.bucket;
      document.querySelectorAll('[data-bucket]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });
  document.querySelectorAll('[data-status]').forEach(b => {
    b.addEventListener('click', () => {
      activeStatus = b.dataset.status;
      document.querySelectorAll('[data-status]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });
</script>
<style>
  button.active { color: var(--ink); border: 1px solid var(--line-2); }
  .game-row { display: block; color: inherit; }
  .game-row-panel { transition: border-color 0.15s ease, transform 0.15s ease; }
  .game-row:hover .game-row-panel { border-color: var(--line-2); transform: translateY(-1px); }
  .game-row-offline .game-row-panel { opacity: 0.7; }
  .game-row-offline .game-card-name { color: var(--ink-dim); }
  .game-row-offline:hover .game-row-panel { opacity: 0.95; }
  .game-thumb { width: 64px; height: 64px; flex-shrink: 0; border: 1px solid var(--line); background: rgba(255,255,255,0.03); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .game-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .game-row-offline .game-thumb { filter: grayscale(0.6); }
</style>
</body>
</html>
