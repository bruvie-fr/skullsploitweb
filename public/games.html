<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>games · skullsploit</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<script src="/js/common.js"></script>
<script>mountNav('/games');</script>
<section class="hero" style="padding-top: clamp(60px,8vw,100px); padding-bottom: clamp(40px,5vw,60px);">
  <div class="hero-grid">
    <div>
      <span class="label reveal reveal-1">games</span>
      <h1 class="reveal reveal-2" style="margin-top: 14px; font-size: clamp(56px,12vw,160px);">games</h1>
      <p class="reveal reveal-3 lead" style="max-width: 460px; margin-top: 24px;">the titles we currently support. tap one to join.</p>
    </div>
    <aside class="hero-meta reveal reveal-4">
      <div><span class="k">total</span><span class="v" id="ttl">—</span></div>
      <div><span class="k">supported</span><span class="v" id="sup">—</span></div>
    </aside>
  </div>
</section>
<section class="container-wide" style="padding-top: 0;">
  <div class="row-between" style="margin-bottom: 28px; gap: 14px;">
    <input id="search" placeholder="search games..." style="max-width: 360px;" />
    <div class="row" style="gap: 6px;">
      <button class="btn-ghost active" data-filter="all">all</button>
      <button class="btn-ghost" data-filter="live">supported</button>
      <button class="btn-ghost" data-filter="dead">soon</button>
    </div>
  </div>
  <div class="grid grid-3" id="grid"></div>
</section>
<div class="modal-backdrop" id="joinModal">
  <div class="modal">
    <button class="modal-close" id="closeJoin">close</button>
    <span class="label">join a game</span>
    <h2 id="joinTitle" style="margin-top: 10px;">—</h2>
    <p class="muted" style="margin-top: 12px;">paste a session id or server link. we'll attach when the game is live.</p>
    <div class="field" style="margin-top: 24px;">
      <span class="label">session / server link</span>
      <input id="sessId" placeholder="paste here..." />
    </div>
    <div class="row" style="gap: 10px; margin-top: 28px;">
      <button class="btn-solid" id="doJoin">attach →</button>
      <button id="cancelJoin">cancel</button>
    </div>
    <p class="muted" style="margin-top: 18px; font-size: 13px;">api coming soon — this is queued client-side for now.</p>
  </div>
</div>
<script>mountFooter();</script>
<script>
  let allGames = [];
  let activeFilter = 'all';

  (async () => {
    const me = await requireSession();
    if (!me) return;
    try {
      const { games } = await api('/api/games');
      allGames = games;
      document.getElementById('ttl').textContent = games.length;
      document.getElementById('sup').textContent = games.filter(g => g.supported).length;
      render();
    } catch { toast('failed to load games'); }
  })();

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const games = allGames.filter(g => {
      if (q && !g.name.toLowerCase().includes(q)) return false;
      if (activeFilter === 'live' && !g.supported) return false;
      if (activeFilter === 'dead' && g.supported) return false;
      return true;
    });
    const grid = document.getElementById('grid');
    if (!games.length) {
      grid.innerHTML = `<div class="panel" style="grid-column: 1 / -1;"><p class="muted">no games match.</p></div>`;
      return;
    }
    grid.innerHTML = games.map((g, i) => `
      <div class="game-card" data-id="${g.id}">
        <div>
          <div class="game-card-num">${String(i+1).padStart(2,'0')}</div>
          <div class="game-card-name" style="margin-top: 12px;">${escapeHtml(g.name)}</div>
          <div class="muted" style="font-size: 13px; margin-top: 10px;">${g.players.toLocaleString()} online</div>
        </div>
        <div class="game-card-meta">
          <span class="chip ${g.supported ? 'live' : 'dead'}">${g.supported ? 'live' : 'soon'}</span>
          <button class="join-btn" data-name="${escapeHtml(g.name)}" ${g.supported ? '' : 'disabled'}>join →</button>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.join-btn').forEach(b => {
      b.addEventListener('click', () => {
        document.getElementById('joinTitle').textContent = b.dataset.name;
        document.getElementById('joinModal').classList.add('open');
      });
    });
  }

  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('[data-filter]').forEach(b => {
    b.addEventListener('click', () => {
      activeFilter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });

  const closeM = () => document.getElementById('joinModal').classList.remove('open');
  document.getElementById('closeJoin').addEventListener('click', closeM);
  document.getElementById('cancelJoin').addEventListener('click', closeM);
  document.getElementById('doJoin').addEventListener('click', () => {
    if (!document.getElementById('sessId').value.trim()) { toast('paste a session link first'); return; }
    closeM();
    toast('queued — api coming soon');
  });
</script>
<style>
  button.active { color: var(--ink); border: 1px solid var(--line-2); }
</style>
</body>
</html>
