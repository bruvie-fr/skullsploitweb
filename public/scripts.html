<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>scripts · skullsploit</title>
<link rel="icon" type="image/png" href="/img/skull.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<script src="/js/common.js"></script>
<script>mountNav('/scripts');</script>
<section class="hero" style="padding-top: clamp(60px,8vw,100px); padding-bottom: clamp(40px,5vw,60px);">
  <div class="hero-grid">
    <div>
      <span class="label reveal reveal-1">scripts</span>
      <h1 class="reveal reveal-2" style="margin-top: 14px; font-size: clamp(56px,12vw,160px);">scripts</h1>
      <p class="reveal reveal-3 lead" style="max-width: 460px; margin-top: 24px;">scripts shared by our developers. tap the heart on the ones you love.</p>
    </div>
    <aside class="hero-meta reveal reveal-4">
      <div><span class="k">total</span><span class="v" id="ttl">—</span></div>
      <div><span class="k">your likes</span><span class="v" id="myLikes">—</span></div>
    </aside>
  </div>
</section>
<section class="container-wide" style="padding-top: 0;">
  <div class="stack" style="gap: 16px; margin-bottom: 28px;">
    <input id="search" placeholder="search by title, author, or tag..." style="max-width: 480px;" />
    <div class="row-between" style="gap: 14px;">
      <div class="row" style="gap: 6px;">
        <button class="btn-ghost active" data-cat="all">all</button>
        <button class="btn-ghost" data-cat="script">scripts</button>
        <button class="btn-ghost" data-cat="gui">guis</button>
        <button class="btn-ghost" data-cat="morph">morphs</button>
      </div>
      <div class="row" style="gap: 6px;">
        <button class="btn-ghost active" data-filter="all">recent</button>
        <button class="btn-ghost" data-filter="liked">liked</button>
        <button class="btn-ghost" data-filter="popular">popular</button>
      </div>
    </div>
  </div>
  <div id="list"></div>
</section>
<div class="modal-backdrop" id="viewModal">
  <div class="modal" style="max-width: 880px;">
    <button class="modal-close" id="closeView">close</button>
    <div class="row-between" style="align-items: start; gap: 16px;">
      <div style="min-width: 0; flex: 1;">
        <span class="label">script</span>
        <h2 id="vTitle" style="margin-top: 8px;">—</h2>
        <div class="row" style="gap: 14px; margin-top: 12px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-dim);">
          <span>by <span id="vAuthor">—</span></span>
          <span id="vDate">—</span>
        </div>
        <div class="tag-list" id="vTags" style="margin-top: 12px;"></div>
      </div>
      <div class="row" style="gap: 8px;">
        <button class="like" id="vLike"><span id="vLikeIcon"></span> <span id="vLikeCount">0</span></button>
        <button id="copyBtn">copy</button>
      </div>
    </div>
    <div class="divider"></div>
    <pre class="code-block" id="vBody"></pre>
  </div>
</div>
<script>mountFooter();</script>
<script>
  let all = [];
  let activeFilter = 'all';
  let activeCat = 'all';
  let me = null;

  (async () => {
    me = await requireSession();
    if (!me) return;
    await load();
  })();

  async function load() {
    try {
      const { scripts } = await api('/api/scripts');
      all = scripts;
      document.getElementById('ttl').textContent = all.length;
      document.getElementById('myLikes').textContent = all.filter(s => s.liked).length;
      render();
    } catch { toast('failed to load scripts'); }
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    let list = all.filter(s => {
      if (activeCat !== 'all' && (s.category || 'script') !== activeCat) return false;
      if (activeFilter === 'liked' && !s.liked) return false;
      if (q) {
        const hay = `${s.title} ${s.author} ${(s.tags || []).join(' ')} ${s.category || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    if (activeFilter === 'popular') list = list.slice().sort((a, b) => b.likeCount - a.likeCount);

    const c = document.getElementById('list');
    if (!list.length) {
      c.innerHTML = `<div class="panel"><p class="muted">nothing here yet — try a different filter.</p></div>`;
      return;
    }
    c.innerHTML = list.map(s => `
      <div class="script-card">
        <div style="min-width: 0;">
          <div class="row" style="gap: 12px; align-items: baseline; flex-wrap: wrap;">
            <span class="script-card-title">${escapeHtml(s.title)}</span>
            <span class="chip">${escapeHtml(s.category || 'script')}</span>
          </div>
          <div class="script-card-meta" style="margin-top: 8px;">
            <span>by ${escapeHtml(s.author)}</span>
            <span>${formatDate(s.createdAt)}</span>
            <span>${(s.tags || []).map(t => `<span class="kbd">${escapeHtml(t)}</span>`).join(' ')}</span>
          </div>
        </div>
        <div class="script-card-actions">
          <button class="like ${s.liked ? 'on' : ''}" data-like="${s.id}">${HEART_SVG} ${s.likeCount}</button>
          <button data-open="${s.id}">open →</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openScript(b.dataset.open));
    document.querySelectorAll('[data-like]').forEach(b => b.onclick = (e) => { e.stopPropagation(); toggleLike(b.dataset.like, b); });
  }

  async function toggleLike(id, btn) {
    try {
      const r = await api(`/api/scripts/${id}/like`, { method: 'POST' });
      const s = all.find(x => x.id === id);
      if (s) { s.liked = r.liked; s.likeCount = r.count; }
      btn.classList.toggle('on', r.liked);
      btn.innerHTML = `${HEART_SVG} ${r.count}`;
      document.getElementById('myLikes').textContent = all.filter(s => s.liked).length;
      if (document.getElementById('viewModal').classList.contains('open') && document.getElementById('vLike').dataset.id === id) {
        const lk = document.getElementById('vLike');
        lk.classList.toggle('on', r.liked);
        document.getElementById('vLikeCount').textContent = r.count;
      }
    } catch (e) { toast(e.message); }
  }

  function openScript(id) {
    const s = all.find(x => x.id === id);
    if (!s) return;
    document.getElementById('vTitle').textContent = s.title;
    document.getElementById('vAuthor').textContent = s.author;
    document.getElementById('vDate').textContent = formatDate(s.createdAt);
    document.getElementById('vBody').textContent = s.body;
    document.getElementById('vTags').innerHTML = (s.tags || []).map(t => `<span class="kbd">${escapeHtml(t)}</span>`).join(' ');
    const lk = document.getElementById('vLike');
    lk.dataset.id = s.id;
    lk.classList.toggle('on', s.liked);
    document.getElementById('vLikeIcon').innerHTML = HEART_SVG;
    document.getElementById('vLikeCount').textContent = s.likeCount;
    lk.onclick = () => toggleLike(s.id, lk);

    document.getElementById('viewModal').classList.add('open');
    document.getElementById('copyBtn').onclick = () => { navigator.clipboard.writeText(s.body); toast('copied'); };
  }

  document.getElementById('closeView').addEventListener('click', () => document.getElementById('viewModal').classList.remove('open'));
  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('[data-filter]').forEach(b => {
    b.addEventListener('click', () => {
      activeFilter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });
  document.querySelectorAll('[data-cat]').forEach(b => {
    b.addEventListener('click', () => {
      activeCat = b.dataset.cat;
      document.querySelectorAll('[data-cat]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });
</script>
<style>
  button.active { color: var(--ink); border: 1px solid var(--line-2); }
</style>
</body>
</html>
